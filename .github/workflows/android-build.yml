name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Stockfish 19 engine binary (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sL --retry 3 -o /tmp/sf19.tar.gz \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz"
          tar -xzf /tmp/sf19.tar.gz -C /tmp stockfish/stockfish-android-arm64-universal
          cp /tmp/stockfish/stockfish-android-arm64-universal app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
          head -c 4 app/src/main/jniLibs/arm64-v8a/libstockfish.so | grep -q "$(printf '\177ELF')" \
            || { echo "Stockfish binary is not a valid ELF file"; exit 1; }
          echo "Stockfish bundled: $(du -h app/src/main/jniLibs/arm64-v8a/libstockfish.so | cut -f1)"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate training content
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 3
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Chess-Coach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
